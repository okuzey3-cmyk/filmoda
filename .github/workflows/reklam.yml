name: reklam-yap
on: workflow_dispatch
permissions:
  contents: write
jobs:
  yap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install playwright edge-tts && playwright install --with-deps chromium
      - run: python3 tools/reklam_yap.py
      - run: |
          git config user.name "reklam-bot"
          git config user.email "reklam-bot@users.noreply.github.com"
          git add ai/reklam
          git commit -m "Reklam videosu" || true
          git pull --rebase
          git push
