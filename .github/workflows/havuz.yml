name: havuz-say
on: workflow_dispatch
permissions:
  contents: write
jobs:
  say:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/havuz_say.py
      - run: |
          git config user.name "havuz-bot"
          git config user.email "havuz-bot@users.noreply.github.com"
          git add ai/havuz.md
          git commit -m "havuz olcumu" || true
          git push
