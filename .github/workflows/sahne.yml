name: sahne-cek
on: workflow_dispatch
permissions:
  contents: write
jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python3 tools/sahne_cek.py
      - run: |
          git config user.name "sahne-bot"
          git config user.email "sahne-bot@users.noreply.github.com"
          git add ai/sahne
          git commit -m "Reklam ekranlari" || true
          git pull --rebase
          git push
