name: Android AAB
on:
  workflow_dispatch:
  push:
    paths: ["twa/**", ".github/workflows/aab.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Bubblewrap kur
        run: npm i -g @bubblewrap/cli
      - name: Android SDK hazirla
        run: |
          SDK=$HOME/sdk
          mkdir -p $SDK
          CT=$(ls -d $ANDROID_HOME/cmdline-tools/*/ | head -1)
          cp -r $CT/* $SDK/
          yes | $SDK/bin/sdkmanager --sdk_root=$SDK --licenses > /dev/null || true
          $SDK/bin/sdkmanager --sdk_root=$SDK "platform-tools" "platforms;android-36" "build-tools;36.1.0" | tail -3
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$SDK\"}" > ~/.bubblewrap/config.json
          echo "sdk=$SDK" ; ls $SDK
      - name: Imza anahtari olustur
        working-directory: twa
        run: |
          PW=$(openssl rand -hex 12)
          echo "$PW" > anahtar-sifresi.txt
          keytool -genkeypair -keystore android.keystore -alias filmoda -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PW" -keypass "$PW" -dname "CN=Filmoda, O=Filmoda, C=TR"
          echo "PW=$PW" >> $GITHUB_ENV
      - name: AAB uret
        working-directory: twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.PW }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.PW }}
        run: |
          set +e
          (bubblewrap update --skipVersionUpgrade --manifest=twa-manifest.json && bubblewrap build --skipPwaValidation) < /dev/null > build.log 2>&1
          RC=$?
          (grep -n -A12 "What went wrong" build.log | head -40; grep -n -i "Caused by" build.log | head -8) | sed 's/\x1b\[[0-9;]*[a-zA-Z]//g' | tr -d '\r' | awk '{printf "%s%%0A", $0}' | sed 's/^/::error::/'
          echo
          ls -la
          exit $RC
      - name: Dosyalari topla
        run: |
          mkdir out
          cp twa/app-release-bundle.aab out/filmoda.aab
          cp twa/android.keystore twa/anahtar-sifresi.txt out/
          keytool -list -v -keystore twa/android.keystore -storepass "$PW" | grep -i "SHA256" > out/yukleme-anahtari-sha256.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: filmoda-aab
          path: out
          retention-days: 2
