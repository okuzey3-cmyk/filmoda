name: Android AAB
on:
  workflow_dispatch:
  push:
    paths: ["twa/**", ".github/workflows/aab.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Bubblewrap kur
        run: npm i -g @bubblewrap/cli
      - name: Bubblewrap ayari
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
      - name: Imza anahtari olustur
        working-directory: twa
        run: |
          PW=$(openssl rand -hex 12)
          echo "$PW" > anahtar-sifresi.txt
          keytool -genkeypair -v -keystore android.keystore -alias filmoda -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PW" -keypass "$PW" -dname "CN=Filmoda, O=Filmoda, C=TR"
          echo "PW=$PW" >> $GITHUB_ENV
      - name: AAB uret
        working-directory: twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.PW }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.PW }}
        run: bubblewrap build --skipPwaValidation
      - name: Dosyalari topla
        run: |
          mkdir out
          cp twa/app-release-bundle.aab out/filmoda.aab
          cp twa/android.keystore twa/anahtar-sifresi.txt out/
          keytool -list -v -keystore twa/android.keystore -storepass "$PW" | grep -i "SHA256" > out/yukleme-anahtari-sha256.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: filmoda-aab
          path: out
          retention-days: 2
