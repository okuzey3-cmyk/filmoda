name: ekran-cek
on: workflow_dispatch
permissions:
  contents: write
jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python3 tools/ekran_cek.py
      - run: |
          git config user.name "ekran-bot"
          git config user.email "ekran-bot@users.noreply.github.com"
          git add ai/ekranlar
          git commit -m "Gercek ekran goruntuleri" || true
          git pull --rebase
          git push
