name: plat-test
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python3 tools/plat_test.py
      - run: |
          git config user.name "plat-bot"
          git config user.email "plat-bot@users.noreply.github.com"
          git add ai/plat
          git commit -m "Platform testi" || true
          git pull --rebase
          git push
