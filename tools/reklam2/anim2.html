<!doctype html><html><head><meta charset="utf-8"><style>

#fade{position:absolute;left:0;top:0;width:1080px;height:1920px;background:#0e0812;opacity:0}

</style></head><body><div id="st">
<canvas id="bk" width="1080" height="1920"></canvas>

<rect x="70" y="1440" width="200" height="240" rx="80"/><rect x="810" y="1440" width="200" height="240" rx="80"/>

<circle cx="660" cy="1268" r="60"/><rect x="590" y="1322" width="140" height="160" rx="64"/>
</g></svg></div>
<div id="logo" class="abs"><img id="logoimg" src="../../icon-512.png" style="position:absolute;left:-150px;top:-235px;width:300px;height:300px;border-radius:70px;box-shadow:0 30px 90px rgba(0,0,0,.5),0 0 90px rgba(243,160,180,.45)"><div style="position:absolute;left:-400px;top:90px;width:800px;text-align:center;color:#fff;font-weight:700;font-size:140px;letter-spacing:-3px;line-height:1">Filmoda</div></div>

<div id="c2" class="abs card"><img src="../../ai/sahne/kart2.png"></div>

<div id="p2" class="abs pill"><div class="ic"><svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><rect x="3" y="6" width="18" height="12" rx="3"/><path d="M7.5 15v-3.2a1.5 1.5 0 0 1 3 0V15M7.5 13.6h3M13 9.5v5.5M13 9.5h1.4a2.7 2.7 0 0 1 0 5.5H13"/><path d="M3 21L21 3" stroke-width="3"/></svg></div>Reklamsız</div>
<div id="p3" class="abs pill"><div class="ic"><svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c.8-4 3.8-6 7.5-6s6.7 2 7.5 6"/><path d="M3 21L21 3" stroke-width="3"/></svg></div>Üyeliksiz</div>
<div id="eicon" class="abs"><img src="../../icon-512.png" style="position:absolute;left:-170px;top:-170px;width:340px;height:340px;border-radius:80px;box-shadow:0 30px 100px rgba(0,0,0,.55),0 0 110px rgba(243,160,180,.5)"></div>
<div id="ename" class="abs" style="width:900px;left:-450px;top:-70px;text-align:center;color:#fff;font-weight:700;font-size:150px;letter-spacing:-3px;line-height:1">Filmoda</div>
<div id="gp" class="abs"><svg width="64" height="64" viewBox="0 0 24 24"><path d="M4 2.5v19l16-9.5z" fill="#e0708d"/><path d="M4 2.5l10.5 9.5L4 21.5z" fill="#f3a0b4"/><path d="M14.5 12l2.8-2.8L20 12l-2.7 2.8z" fill="#ffd9e0"/></svg><span>Google Play'de</span></div>
<div id="tag" class="abs" style="width:900px;left:-450px;top:-30px;text-align:center;color:#f3a0b4;font-weight:600;font-size:50px">Bu akşam ne izlesem?</div>
<div id="flash"></div><div id="fade"></div>
</div>
<script>
const LAND=location.search.includes('land');
const W=LAND?1920:1080,H=LAND?1080:1920;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const eo=u=>1-Math.pow(1-u,3), eio=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2, ei=u=>u*u*u;
const bk=u=>{const c1=1.3,c3=c1+1;return 1+c3*Math.pow(u-1,3)+c1*Math.pow(u-1,2)};
function kf(t,p,ez){if(t<=p[0][0])return p[0][1];for(let i=0;i<p.length-1;i++){const[a,x]=p[i],[b,y]=p[i+1];if(t<b){let u=(t-a)/(b-a);if(ez)u=ez(u);return x+(y-x)*u}}return p[p.length-1][1]}
const pop=(t,t0,d=.6)=>t<t0?0:bk(clamp((t-t0)/d,0,1));
const $=id=>document.getElementById(id);
document.documentElement.style.width=document.body.style.width=W+'px';document.documentElement.style.height=document.body.style.height=H+'px';
const st=$('st');st.style.width=W+'px';st.style.height=H+'px';$('bk').width=W;$('bk').height=H;$('flash').style.width=W+'px';$('flash').style.height=H+'px';$('fade').style.width=W+'px';$('fade').style.height=H+'px';
// YERLESIM
const C=LAND?{room:[420,-681],logoBig:[960,560],logoSm:[480,540,.8],logoSm2:[480,235,.5],phone:[1380,540],phoneSc:.8,phoneIn:[1380,1500],
 cx:[800,1160,1520],cy:[560,530,560],co:[480,640,.85],pill:[960,[250,540,830]],ei:[960,380],en:[960,650],gp:[960,840],tg:[960,975]}
 :{room:[0,0],logoBig:[540,930],logoSm:[540,200,.38],logoSm2:[540,200,.38],phone:[540,1030],phoneSc:1,phoneIn:[540,2400],
 cx:[185,540,895],cy:[1020,960,1020],co:[540,1340,1],pill:[540,[700,940,1180]],ei:[540,790],en:[540,1070],gp:[540,1290],tg:[540,1470]};
// ZAMAN CIZELGESI (ses cumleleri arasi +0.7 sn nefes)
const TL={flash:4.58,phoneIn:5.3,tap:5.95,res:6.45,c:[6.8,7.25,7.7],cOut:8.35,det:8.45,co:8.68,ring1:8.8,ring2:10.25,coOut:11.55,pills:[11.94,12.88,13.84],pOut:15.0,end:15.36,tot:18.4};
const SCREENS=[['ana',5.3,5.6],['sonuc1',TL.res,TL.res+.4],['detay',TL.det,TL.det+.4]];
const sc0=$('scr0');SCREENS.forEach(s=>{const i=document.createElement('img');i.className='s';i.id='s_'+s[0];i.src='../../ai/sahne/'+s[0]+'.png';sc0.appendChild(i)});
const rip=document.createElement('div');rip.className='rip';rip.id='rip0';$('phone').appendChild(rip);
function place(el,x,y,s,o,rot,blur){el.style.transform=`translate(${x}px,${y}px) scale(${s})${rot?` rotate(${rot}deg)`:''}`;el.style.opacity=o;el.style.filter=blur?`blur(${blur}px)`:'none'}
const bkc=$('bk').getContext('2d');const P=[];let sd=7;const rnd=()=>{sd=(sd*16807)%2147483647;return sd/2147483647};
for(let i=0;i<34;i++)P.push({x:rnd()*W,y:rnd()*H,r:24+rnd()*70,v:12+rnd()*24,a:.07+rnd()*.16,h:rnd()<.6?[243,160,180]:[255,196,140],ph:rnd()*6.28});
function bokeh(t,k){bkc.clearRect(0,0,W,H);P.forEach(p=>{const y=((p.y-p.v*t)%H+H)%H,x=p.x+Math.sin(t*.5+p.ph)*30,a=p.a*k*(.75+.25*Math.sin(t*1.1+p.ph));const g=bkc.createRadialGradient(x,y,0,x,y,p.r);g.addColorStop(0,`rgba(${p.h},${a})`);g.addColorStop(1,`rgba(${p.h},0)`);bkc.fillStyle=g;bkc.beginPath();bkc.arc(x,y,p.r,0,6.3);bkc.fill()})}
function render(t){
 const F=TL.flash;
 const tv=kf(t,[[0,.18],[1.8,.3],[3.4,.55],[F-.1,1]],eio);
 $('sofa').style.filter='drop-shadow(0 -5px 2px rgba(255,196,176,'+(.7*clamp(tv,0,1))+'))';
 $('glow').setAttribute('opacity',clamp(tv,0,1));$('scrn').setAttribute('opacity',clamp(tv+.1,0,1));
 const cam=1+.05*clamp(t/F,0,1)+kf(t,[[F-.45,0],[F+.05,9]],ei);
 place($('room'),C.room[0],C.room[1],cam,t<F+.1?1:0);
 bokeh(t,t<F?.55:1);
 $('flash').style.opacity=kf(t,[[F-.3,0],[F,1],[F+.55,0]],eo);
 // logo
 const lp=t<F?0:pop(t,F,.7);
 let lx,ly,ls;
 if(LAND){lx=kf(t,[[5.4,C.logoBig[0]],[6.1,C.logoSm[0]]],eio);ly=kf(t,[[5.4,C.logoBig[1]],[6.1,C.logoSm[1]],[8.3,C.logoSm[1]],[8.9,C.logoSm2[1]]],eio);ls=kf(t,[[5.4,1],[6.1,C.logoSm[2]],[8.3,C.logoSm[2]],[8.9,C.logoSm2[2]]],eio)}
 else{lx=540;ly=kf(t,[[5.4,C.logoBig[1]],[6.1,C.logoSm[1]]],eio);ls=kf(t,[[5.4,1],[6.1,C.logoSm[2]]],eio)}
 const lo=t<11.6?1:kf(t,[[11.6,1],[12.0,0]]);
 place($('logo'),lx,ly,ls*lp,lo);
 // telefon
 const pin=kf(t,[[TL.phoneIn,0],[TL.phoneIn+.8,1]],eo);
 const px=C.phoneIn[0]+(C.phone[0]-C.phoneIn[0])*pin, py=C.phoneIn[1]+(C.phone[1]-C.phoneIn[1])*pin;
 let pS=1,pO=1,pB=0;
 if(t>=TL.res+.3&&t<TL.cOut){const u=clamp((t-TL.res-.3)/.5,0,1);pS=1-.1*eo(u);pO=1-.7*eo(u);pB=10*eo(u)}
 else if(t>=TL.cOut&&t<TL.cOut+.5){const u=eo((t-TL.cOut)/.5);pS=.9+.1*u;pO=.3+.7*u;pB=10*(1-u)}
 else if(t>=TL.cOut+.5&&t<TL.coOut){pS=1+.015*(t-TL.cOut-.5)}
 else if(t>=TL.coOut){const u=eo(clamp((t-TL.coOut)/.5,0,1));pS=1.02-.25*u;pO=1-.72*u;pB=16*u; if(t>=TL.pOut)pO*=1-clamp((t-TL.pOut)/.25,0,1)}
 place($('phone'),px,py,pS*C.phoneSc,t<TL.phoneIn?0:pO,0,pB);
 SCREENS.forEach(([n,a,b],i)=>{const e=$('s_'+n);let o=t>=a?1:0;if(t>=a&&t<b&&i>0)o=eo((t-a)/(b-a));if(i===0&&t>=a)o=1;const nb=SCREENS[i+1];if(nb&&t>=nb[2])o=0;e.style.opacity=o;e.style.zIndex=i});
 // dokunus
 const r=rip,u=clamp((t-TL.tap)/.6,0,1);r.style.left=(791*.648)+'px';r.style.top=(891*.648)+'px';r.style.opacity=(t>=TL.tap&&t<TL.tap+.6)?(1-u)*.95:0;r.style.transform=`scale(${.6+2.2*eo(u)})`;
 // kartlar
 TL.c.forEach((ct,i)=>{const e=$('c'+(i+1)),s=pop(t,ct,.7),ex=kf(t,[[TL.cOut,0],[TL.cOut+.4,1]],ei);const fy=Math.sin(t*1.6+i)*5;
  place(e,C.cx[i],C.cy[i]+fy+ex*(LAND?500:700)+kf(t,[[ct,60],[ct+.5,0]],eo),Math.max(s,0)*(i==1?1.1:1),t>=TL.cOut+.45?0:1,[-7,0,7][i]*(t<ct+.6?kf(t,[[ct,2],[ct+.6,1]],eo):1))});
 // callout
 const cs=pop(t,TL.co,.6)*(t>=TL.coOut?1-eo(clamp((t-TL.coOut)/.35,0,1)):1);
 place($('co'),C.co[0],C.co[1]+kf(t,[[TL.co,50],[TL.co+.5,0]],eo),cs*C.co[2],t>=TL.co&&t<TL.coOut+.4?1:0);
 const rg=$('ring');let rx=0,ro=0;if(t>=TL.ring1&&t<TL.ring1+1.2){ro=Math.sin(clamp((t-TL.ring1)/1.2,0,1)*Math.PI)}else if(t>=TL.ring2&&t<TL.ring2+1.1){rx=1;ro=Math.sin(clamp((t-TL.ring2)/1.1,0,1)*Math.PI)}
 rg.style.width=(rx?400:430)+'px';rg.style.top='18px';rg.style.height='184px';rg.style.opacity=ro;rg.style.left=(rx?536:12)+'px';
 // rozetler
 TL.pills.forEach((bt,i)=>{const e=$('p'+(i+1));const s=pop(t,bt,.65),ex=kf(t,[[TL.pOut,0],[TL.pOut+.25,1]],ei);
  place(e,C.pill[0]+kf(t,[[bt,i%2?-90:90],[bt+.5,0]],eo),C.pill[1][i],s*(1-.12*ex),(t>=TL.pOut+.3?0:1)*(1-ex))});
 // bitis
 const E=TL.end,ep=pop(t,E,.7);
 place($('eicon'),C.ei[0],C.ei[1],ep,t>=E?1:0);
 place($('ename'),C.en[0],C.en[1]+kf(t,[[E+.15,40],[E+.6,0]],eo),1,kf(t,[[E+.15,0],[E+.6,1]]));
 place($('gp'),C.gp[0],C.gp[1]+kf(t,[[E+.7,50],[E+1.2,0]],eo),1,kf(t,[[E+.7,0],[E+1.15,1]]));
 place($('tag'),C.tg[0],C.tg[1],1,kf(t,[[E+1.3,0],[E+1.8,1]]));
 $('fade').style.opacity=kf(t,[[TL.tot-.4,0],[TL.tot,1]]);
}
window.render=render;window.ready=Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>i.onload=r)));
</script></body></html>
