</style></head><body><div id="st">

<div id="tag" class="abs" style="width:900px;left:-450px;top:-30px;text-align:center;color:#f3a0b4;font-weight:600;font-size:50px">Bu akşam ne izlesem?</div>

</div>
<script>
const W=1080,H=1920,clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const eo=u=>1-Math.pow(1-u,3), eio=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2, ei=u=>u*u*u;
const bk=u=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(u-1,3)+c1*Math.pow(u-1,2)};
function kf(t,p,ez){if(t<=p[0][0])return p[0][1];for(let i=0;i<p.length-1;i++){const[a,x]=p[i],[b,y]=p[i+1];if(t<b){let u=(t-a)/(b-a);if(ez)u=ez(u);return x+(y-x)*u}}return p[p.length-1][1]}
const pop=(t,t0,d=.45)=>t<t0?0:bk(clamp((t-t0)/d,0,1));
const $=id=>document.getElementById(id);
const SCREENS=[['ana',4.3,4.6],['ruh',4.6,5.3],['secim',5.3,5.78],['sonuc1',5.78,7.28],['detay',7.28,99]];
const sc0=$('scr0');SCREENS.forEach(s=>{const i=document.createElement('img');i.className='s';i.id='s_'+s[0];i.src='../../ai/sahne/'+s[0]+'.png';sc0.appendChild(i)});
const rips=[[4.52,791*.648,891*.648],[5.72,540*.648,1471*.648]];
rips.forEach((r,i)=>{const d=document.createElement('div');d.className='rip';d.id='rip'+i;$('phone').appendChild(d)});
const hl=$('hl');hl.style.left=(292-235)*.648+'px';hl.style.top=(1234-80)*.648+'px';hl.style.width=470*.648+'px';hl.style.height=160*.648+'px';
function place(el,x,y,s,o,rot,blur){el.style.transform=`translate(${x}px,${y}px) scale(${s})${rot?` rotate(${rot}deg)`:''}`;el.style.opacity=o;el.style.filter=blur?`blur(${blur}px)`:'none'}
// bokeh
const bkc=$('bk').getContext('2d');const P=[];let sd=7;const rnd=()=>{sd=(sd*16807)%2147483647;return sd/2147483647};
for(let i=0;i<34;i++)P.push({x:rnd()*W,y:rnd()*H,r:24+rnd()*70,v:14+rnd()*30,a:.07+rnd()*.16,h:rnd()<.6?[243,160,180]:[255,196,140],ph:rnd()*6.28});
function bokeh(t,k){bkc.clearRect(0,0,W,H);P.forEach(p=>{const y=((p.y-p.v*t)%H+H)%H,x=p.x+Math.sin(t*.6+p.ph)*30,a=p.a*k*(.75+.25*Math.sin(t*1.3+p.ph));const g=bkc.createRadialGradient(x,y,0,x,y,p.r);g.addColorStop(0,`rgba(${p.h},${a})`);g.addColorStop(1,`rgba(${p.h},0)`);bkc.fillStyle=g;bkc.beginPath();bkc.arc(x,y,p.r,0,6.3);bkc.fill()})}
function render(t){
 // oda
 const tv=kf(t,[[0,.18],[1.5,.28],[3.0,.5],[3.7,1]],eio)*(1+.04*Math.sin(t*9)*(t<3.6?1:0));
 $('sofa').style.filter='drop-shadow(0 -5px 2px rgba(255,196,176,'+(.7*clamp(tv,0,1))+'))';$('glow').setAttribute('opacity',clamp(tv,0,1));$('scrn').setAttribute('opacity',clamp(tv+.1,0,1));
 const cam=1+.06*clamp(t/3.9,0,1)+kf(t,[[3.45,0],[3.95,9]],ei);
 place($('room'),0,0,cam,t<3.98?1:0);
 bokeh(t,t<3.9?.55:1);
 // flas
 $('flash').style.opacity=kf(t,[[3.6,0],[3.9,1],[4.4,0]],eo);
 // logo
 const lp=t<3.9?0:pop(t,3.9,.5);
 const ly=kf(t,[[4.45,930],[4.95,200]],eio),ls=kf(t,[[4.45,1],[4.95,.38]],eio);
 place($('logo'),540,ly,ls*lp,t<9.75?1:kf(t,[[9.75,1],[10.0,0]]));
 // telefon
 const pY=kf(t,[[4.3,2400],[5.0,1030]],eo);
 let pS=1,pO=1,pB=0;
 if(t>=5.85&&t<7.15){const u=clamp((t-5.85)/.2,0,1);pS=1-.12*eo(u);pO=1-.65*eo(u);pB=10*eo(u)}
 else if(t>=7.15&&t<7.4){const u=eo((t-7.15)/.25);pS=.88+.12*u;pO=.35+.65*u;pB=10*(1-u)}
 else if(t>=7.4&&t<8.5){pS=1+.02*(t-7.4)}
 else if(t>=8.5&&t<9.8){pS=1.022-.05*eo((t-8.5)/1.3)}
 else if(t>=9.8){const u=eo(clamp((t-9.8)/.3,0,1));pS=.972-.2*u;pO=1-.72*u;pB=16*u; if(t>=12.3)pO*=1-clamp((t-12.3)/.2,0,1)}
 place($('phone'),540,pY,pS,t<4.25?0:pO,0,pB);
 SCREENS.forEach(([n,a,b],i)=>{const e=$('s_'+n);let o=0;if(t>=a)o=1;if(i>0&&t<a)o=0;if(t>=a&&t<a+.22)o=eo((t-a)/.22);const nb=SCREENS[i+1];if(nb&&t>=nb[1]+.22)o=0;e.style.opacity=o;e.style.zIndex=i;
  if(n==='sonuc1'){e.style.transform=`translateX(${kf(t,[[5.78,50],[6.05,0]],eo)}px)`}});
 // dokunus
 rips.forEach((r,i)=>{const e=$('rip'+i),u=clamp((t-r[0])/.5,0,1);e.style.left=r[1]+'px';e.style.top=r[2]+'px';e.style.opacity=(t>=r[0]&&t<r[0]+.5)?(1-u)*.95:0;e.style.transform=`scale(${.6+2.2*eo(u)})`});
 const cs=pop(t,7.28,.5)*(t>=9.8?1-eo(clamp((t-9.8)/.25,0,1)):1);place($('co'),540,1340+kf(t,[[7.28,60],[7.7,0]],eo),cs,t>=7.28&&t<10.1?1:0);
 const rg=$('ring');let rx=0,ro=0;if(t>=7.32&&t<8.2){rx=0;ro=Math.sin(clamp((t-7.32)/.88,0,1)*Math.PI)}else if(t>=9.0&&t<9.8){rx=1;ro=Math.sin(clamp((t-9.0)/.8,0,1)*Math.PI)}
 rg.style.left=(rx?560:40-38+8)+'px';rg.style.width=(rx?400:430)+'px';rg.style.top='18px';rg.style.height='184px';rg.style.opacity=ro;rg.style.left=(rx?536:12)+'px';
 // kartlar
 const cd=[[6.06,185,1020,-7],[6.34,540,960,0],[6.62,895,1020,7]];
 cd.forEach((c,i)=>{const e=$('c'+(i+1)),s=pop(t,c[0],.5),ex=kf(t,[[7.12,0],[7.4,1]],ei);const fy=Math.sin(t*2+i)*6;
  place(e,c[1],c[2]+fy+ex*700+kf(t,[[c[0],70],[c[0]+.35,0]],eo),Math.max(s,0)*(i==1?1.12:1),t>=7.42?0:1,c[3]*(t<c[0]+.5?kf(t,[[c[0],2],[c[0]+.5,1]],eo):1))});
 // rozetler
 [[9.84,700],[10.78,940],[11.74,1180]].forEach((b,i)=>{const e=$('p'+(i+1));const s=pop(t,b[0],.5),ex=kf(t,[[12.38,0],[12.58,1]],ei);
  place(e,540+kf(t,[[b[0],i%2?-120:120],[b[0]+.4,0]],eo),b[1],s*(1-.15*ex),(t>=12.62?0:1)*(1-ex));});
 // bitis
 const ep=pop(t,12.56,.55);place($('eicon'),540,790,ep,t>=12.56?1:0);
 place($('ename'),540,1070+kf(t,[[12.72,40],[13.05,0]],eo),1,kf(t,[[12.72,0],[13.05,1]]));
 place($('gp'),540,1290+kf(t,[[13.1,60],[13.5,0]],eo),1,kf(t,[[13.1,0],[13.45,1]]));
 place($('tag'),540,1470,1,kf(t,[[13.6,0],[14.0,1]]));
 $('fade').style.opacity=kf(t,[[14.95,0],[15.27,1]]);
}
window.render=render;window.ready=Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>i.onload=r)));
</script></body></html>
